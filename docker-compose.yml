# Docker Compose — HFT Trading System
# ===========================================
# Runs six services:
#   1. exchange_simulator  — simulated crypto exchange (WebSocket server)
#   2. ai-signal-bot       — Python AI signal generator
#   3. hft-trade-bot       — C++20 v2.0 HFT execution engine (sub-millisecond)
#   4. web-ui              — React web dashboard (278 panels, TradingView-style)
#   5. prometheus          — metrics scraping (all components)
#   6. grafana             — monitoring dashboards (5 pre-built)
#
# Usage:
#   docker-compose up              # Start all services
#   docker-compose up exchange-sim # Start only the exchange simulator
#   docker-compose logs -f         # Follow logs
#   docker-compose logs -f ai-signal-bot
#   # Web UI available at http://localhost:3000
#   # Grafana available at http://localhost:3001 (admin/admin)
#   # Prometheus available at http://localhost:9099
#
# Logs:
#   All services write timestamped logs to /app/logs/ inside the container.
#   Log volumes are mounted: sim-logs, ai-logs, hft-logs.
#   Trade CSV logs: /app/logs/trades_*.csv

services:
  exchange-simulator:
    build:
      context: ./exchange_simulator
      dockerfile: Dockerfile
    container_name: exchange-sim
    ports:
      - "8765:8765"
      - "8775:8775"
    volumes:
      - ./exchange_simulator/config.yaml:/app/exchange_simulator/config.yaml:ro
      - sim-data:/app/data
      - sim-logs:/app/logs
      - sim-audit:/app/logs/audit
    environment:
      - PYTHONUNBUFFERED=1
      # Baked config binds localhost — unreachable via published ports from
      # outside the container without this.
      - EXCHANGE_WS_HOST=0.0.0.0
    command: python -m exchange_simulator --no-visualizer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8775/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-net

  ai-signal-bot:
    build:
      context: ./ai-signal-bot
      dockerfile: Dockerfile
    container_name: ai-signal-bot
    depends_on:
      exchange-simulator:
        condition: service_healthy
    ports:
      - "8766:8766"
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./ai-signal-bot/config/settings.yaml:/app/config/settings.yaml:ro
      - ai-data:/app/data
      - ai-logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # S210: service DNS, not loopback — config/settings.yaml exchange URL
      # defaults to localhost which is the bot's OWN container.
      - WS_URL=ws://exchange-simulator:8765
      - AI_BOT_BIND_HOST=0.0.0.0
    command: python run.py --metrics
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - trading-net

  hft-trade-bot:
    build:
      context: ./hft-trade-bot
      dockerfile: Dockerfile
    container_name: hft-trade-bot
    depends_on:
      exchange-simulator:
        condition: service_healthy
      ai-signal-bot:
        condition: service_healthy
    volumes:
      - ./hft-trade-bot/config:/app/config:ro
      - hft-logs:/app/logs
    ports:
      - "9091:9091"
    command: ./build/hft_trade_bot config/config.yaml
    environment:
      # S210: config.yaml resolves ${HFT_*_WS_URL:-localhost} — inject the
      # compose service names or the bot dials its own loopback.
      - HFT_EXCHANGE_WS_URL=ws://exchange-simulator:8765
      - HFT_AI_SIGNAL_WS_URL=ws://ai-signal-bot:8766
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2'
    healthcheck:
      # --spider sends HEAD; the sidecar only implements GET → wget exit 8
      # marked a healthy bot unhealthy (S389). Use a real GET.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-net

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
      args:
        # These URLs resolve in the USER'S BROWSER (not inside Docker).
        # localhost works when Docker ports are mapped to the host.
        - VITE_WS_EXCHANGE=ws://localhost:8765
        - VITE_WS_SIGNALS=ws://localhost:8766
    container_name: web-ui
    depends_on:
      exchange-simulator:
        condition: service_healthy
      ai-signal-bot:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - trading-net

  # ─── Monitoring: Prometheus + Grafana ───
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: prometheus
    depends_on:
      exchange-simulator:
        condition: service_healthy
      ai-signal-bot:
        condition: service_healthy
    ports:
      - "9099:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-net

  # ─── Alertmanager — routes the 22 rules in alerts.yml ───
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/trading-overview.json
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - trading-net

volumes:
  sim-data:
  sim-logs:
  sim-audit:
  ai-data:
  ai-logs:
  hft-logs:
  prom-data:
  alertmanager-data:
  grafana-data:

networks:
  trading-net:
    driver: bridge
