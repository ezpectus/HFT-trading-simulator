# Pre-commit configuration
#
# The canonical checks live in scripts/pre-commit-hook-git.sh — installed into
# .git/hooks by scripts/install-hooks.bat (Windows) or install-hooks.sh.
# This config exists for contributors who use the `pre-commit` framework;
# it runs the SAME script so both install paths run identical checks.
repos:
  - repo: local
    hooks:
      - id: project-checks
        name: Project lint + tests (scripts/pre-commit-hook-git.sh)
        entry: scripts/pre-commit-hook-git.sh
        language: script
        pass_filenames: false
