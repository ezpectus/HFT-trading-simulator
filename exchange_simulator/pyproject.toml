[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
    "UP038",  # isinstance style — preference, not a bug
    "B905",   # zip() strict= — preference, not a bug
]

[tool.ruff.lint.isort]
known-first-party = ["exchange_simulator"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "E402", "UP035", "UP038", "B007", "B905"]  # test-specific relaxations

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
