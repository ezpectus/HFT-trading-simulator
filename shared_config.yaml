# Shared Configuration — Consistency-Gate Reference
# =======================================================
# NOT loaded at runtime. This file is the canonical reference consumed by
# scripts/test_config_consistency.py, which verifies the component configs
# carry matching values:
#   symbols   — identical symbol set across all four component configs
#   exchanges — exchange ids shared/sim + default_exchange refs valid
#   risk      — shared vs component risk params (warning-level drift report)
#   websocket — exchange host:port + ai-signal-bot endpoint vs component urls
# Per-component runtime settings live in their own configs:
#   exchange_simulator/config.yaml, ai-signal-bot/config/settings.yaml,
#   hft-trade-bot/config/config.yaml

