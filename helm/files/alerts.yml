# ─────────────────────────────────────────────────────────────────────────────
# Prometheus alerting rules for trading system
# ─────────────────────────────────────────────────────────────────────────────
# Load in prometheus.yml via:
#   rule_files:
#     - "alerts.yml"

groups:
  # ── AI Signal Bot alerts ──
  - name: ai-signal-bot
    rules:
      # Circuit breaker tripped — signals are being blocked
      - alert: CircuitBreakerTripped
        expr: ai_signal_bot_circuit_breaker_state == 1
        for: 10s
        labels:
          severity: critical
          service: ai-signal-bot
        annotations:
          summary: "Circuit breaker is OPEN — signals blocked"
          description: "AI Signal Bot circuit breaker has been tripped. No signals are being broadcast. Check recent trade history for consecutive losses."

      # Circuit breaker in half-open (probe mode)
      - alert: CircuitBreakerHalfOpen
        expr: ai_signal_bot_circuit_breaker_state == 2
        for: 30s
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "Circuit breaker in HALF_OPEN — probe mode"
          description: "Circuit breaker is testing recovery with probe signals. If successful, it will close."

      # High signal block rate — breaker frequently active
      - alert: HighSignalBlockRate
        expr: rate(ai_signal_bot_signals_blocked_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "High signal block rate"
          description: "More than 0.5 signals/sec are being blocked by circuit breaker. Strategy may need review."

      # No signals sent in 5 minutes
      - alert: NoSignalsSent
        expr: rate(ai_signal_bot_signals_sent_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "No signals sent in 5 minutes"
          description: "AI Signal Bot has not broadcast any signals in the last 5 minutes. Check bot health."

      # No WebSocket clients connected
      - alert: NoWsClients
        expr: ai_signal_bot_ws_clients_connected == 0
        for: 1m
        labels:
          severity: critical
          service: ai-signal-bot
        annotations:
          summary: "No WebSocket clients connected"
          description: "No HFT Trade Bot or Web UI is connected to the signal publisher."

      # High error rate
      - alert: HighBotErrorRate
        expr: rate(ai_signal_bot_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "High bot error rate"
          description: "Error rate is {{ $value }} errors/sec"

      # Critical error rate
      - alert: CriticalBotErrorRate
        expr: rate(ai_signal_bot_errors_total[5m]) > 1.0
        for: 2m
        labels:
          severity: critical
          service: ai-signal-bot
        annotations:
          summary: "Critical bot error rate"
          description: "Error rate is {{ $value }} errors/sec"

      # High drawdown (>8%)
      - alert: HighDrawdown
        expr: ai_signal_bot_drawdown > 0.08
        for: 5m
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "High drawdown"
          description: "Drawdown is {{ $value * 100 }}% (threshold 8%)"

      # Critical drawdown (>15%)
      - alert: CriticalDrawdown
        expr: ai_signal_bot_drawdown > 0.15
        for: 2m
        labels:
          severity: critical
          service: ai-signal-bot
        annotations:
          summary: "Critical drawdown"
          description: "Drawdown is {{ $value * 100 }}% (threshold 15%)"

      # Low win rate
      - alert: LowWinRate
        expr: ai_signal_bot_win_rate < 0.4
        for: 30m
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "Low win rate"
          description: "Win rate is {{ $value * 100 }}%"

      # Negative PnL
      - alert: NegativePnL
        expr: ai_signal_bot_pnl_total < 0
        for: 10m
        labels:
          severity: warning
          service: ai-signal-bot
        annotations:
          summary: "Negative PnL"
          description: "Total PnL is {{ $value }}"

      # Bot process down — no metrics scraped
      - alert: SignalBotDown
        expr: up{job="ai-signal-bot"} == 0
        for: 30s
        labels:
          severity: critical
          service: ai-signal-bot
        annotations:
          summary: "AI Signal Bot is down"
          description: "Prometheus cannot scrape metrics from AI Signal Bot. Process may have crashed."

  # ── Exchange Simulator alerts ──
  - name: exchange-simulator
    rules:
      # Exchange simulator down
      - alert: ExchangeSimulatorDown
        expr: up{job="exchange-simulator"} == 0
        for: 30s
        labels:
          severity: critical
          service: exchange-simulator
        annotations:
          summary: "Exchange Simulator is down"
          description: "Prometheus cannot scrape metrics from Exchange Simulator."

      # High order rejection rate
      - alert: HighOrderRejectionRate
        expr: exchange_orders_rejected_total / exchange_orders_submitted_total > 0.1
        for: 5m
        labels:
          severity: warning
          service: exchange-simulator
        annotations:
          summary: "High order rejection rate"
          description: "Rejection rate is {{ $value * 100 }}% for {{ $labels.exchange }}"

      # Low order fill rate
      - alert: LowFillRate
        expr: exchange_orders_filled_total / exchange_orders_submitted_total < 0.8
        for: 10m
        labels:
          severity: warning
          service: exchange-simulator
        annotations:
          summary: "Low order fill rate"
          description: "Fill rate is {{ $value * 100 }}% for {{ $labels.exchange }} (threshold 80%)"

      # Equity drop — unrealized losses >5%
      - alert: EquityDrop
        expr: exchange_equity < exchange_balance * 0.95
        for: 5m
        labels:
          severity: warning
          service: exchange-simulator
        annotations:
          summary: "Equity below 95% of balance"
          description: "Unrealized losses exceeding 5% for {{ $labels.exchange }}"

      # Candle generation stalled
      - alert: CandleGenerationStalled
        expr: rate(exchange_candle_count[5m]) == 0
        for: 5m
        labels:
          severity: critical
          service: exchange-simulator
        annotations:
          summary: "Candle generation stalled"
          description: "No new candles generated in 5 minutes — market data feed may be down"

      # Trading has been stopped — orders are being rejected
      - alert: TradingStopped
        expr: exchange_trading_active == 0
        for: 1m
        labels:
          severity: warning
          service: exchange-simulator
        annotations:
          summary: "Trading is STOPPED"
          description: "Trading has been stopped via UI control. All order submissions are being rejected."

  # ── HFT Trade Bot alerts ──
  - name: hft-trade-bot
    rules:
      # HFT bot down
      - alert: HftBotDown
        expr: up{job="hft-trade-bot"} == 0
        for: 30s
        labels:
          severity: critical
          service: hft-trade-bot
        annotations:
          summary: "HFT Trade Bot is down"
          description: "Prometheus cannot scrape metrics from HFT Trade Bot. Process may have crashed."

  # ── System-wide alerts ──
  - name: system
    rules:
      # Prometheus self-monitoring
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 30s
        labels:
          severity: critical
          service: prometheus
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus self-monitoring target is unreachable."

  # ── WebSocket connection alerts ──
  - name: websocket
    rules:
      # High reconnection rate — clients disconnecting/reconnecting frequently
      - alert: HighWsReconnectionRate
        expr: rate(exchange_ws_disconnections_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          service: exchange-simulator
        annotations:
          summary: "High WebSocket reconnection rate"
          description: "Clients are disconnecting more than 0.5/s over the last 5 minutes. Check network stability or server health."

      # No connected clients — all bots/UI disconnected
      - alert: NoWsClientsConnected
        expr: exchange_connected_clients == 0
        for: 2m
        labels:
          severity: warning
          service: exchange-simulator
        annotations:
          summary: "No WebSocket clients connected"
          description: "No clients are connected to the exchange simulator for 2+ minutes. Bots and UI may be down."
