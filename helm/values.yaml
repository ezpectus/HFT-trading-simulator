# Default values for hft-trading-system Helm chart.
# Override via: helm install my-release ./helm -f values.yaml

# ── Global ──
global:
  imagePullPolicy: IfNotPresent
  logFormat: json
  shmSize: 1Gi

# ── Exchange Simulator ──
exchangeSimulator:
  enabled: true
  image:
    repository: ghcr.io/ezpectus/hft-tradebot--lite-version/exchange_simulator
    tag: latest
  ports:
    ws: 8765
    metrics: 8775
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: "1"

# ── AI Signal Bot ──
aiSignalBot:
  enabled: true
  image:
    repository: ghcr.io/ezpectus/hft-tradebot--lite-version/ai-signal-bot
    tag: latest
  ports:
    ws: 8766
    metrics: 9090
    health: 8080
  env:
    openaiApiKey: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: "2"

# ── HFT Trade Bot (C++) ──
hftTradeBot:
  enabled: true
  image:
    repository: ghcr.io/ezpectus/hft-tradebot--lite-version/hft-trade-bot
    tag: latest
  configPath: config/config.prod.yaml
  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 512Mi
      cpu: "2"

# ── Web UI ──
webUi:
  enabled: true
  image:
    repository: ghcr.io/ezpectus/hft-tradebot--lite-version/web-ui
    tag: latest
  port: 3000
  # These are build-time Vite args (inlined into JS bundle at Docker build time).
  # They are NOT runtime env vars — set them as Docker build ARGs, not K8s env.
  # REQUIRED for production — browser-facing WebSocket URLs.
  # For K8s with ingress: wss://trading.example.com/ws-exchange, wss://trading.example.com/ws-signals
  wsExchange: ""  # Set via --set webUi.wsExchange=wss://your-domain/ws-exchange
  wsSignals: ""   # Set via --set webUi.wsSignals=wss://your-domain/ws-signals
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

# ── Monitoring ──
prometheus:
  enabled: true
  image: prom/prometheus:v3.0.0
  storage: 5Gi
  storageClassName: ""
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

# ── Alertmanager (receives the rules vendored into the prometheus chart) ──
alertmanager:
  enabled: true
  image: prom/alertmanager:v0.27.0
  port: 9093
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

grafana:
  enabled: true
  image: grafana/grafana:11.4.0
  adminUser: admin
  adminPassword: ""  # REQUIRED — set via --set grafana.adminPassword=...
  storage: 2Gi
  storageClassName: ""
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

# ── Secrets ──
# The chart reads a Secret named "<release>-api-keys" with these keys:
#   openai-api-key          — LLM signal path (required unless aiSignalBot.env.openaiApiKey is set)
#   exchange-control-token  — sim control-plane auth (order/cancel/start_trading)
#   ai-bot-auth-token       — AI publisher auth on :8766
# Create it before install, e.g.:
#   kubectl create secret generic my-release-api-keys \
#     --from-literal=openai-api-key=... --from-literal=exchange-control-token=... \
#     --from-literal=ai-bot-auth-token=...
# All refs are optional:true — missing keys leave the corresponding auth open
# (same fail-open posture as the compose path without the env vars).

# ── Ingress ──
ingress:
  enabled: false
  className: nginx
  hostname: trading.local
  tls:
    enabled: false
    secretName: trading-tls
