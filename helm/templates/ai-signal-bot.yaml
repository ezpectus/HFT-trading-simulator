{{- if .Values.aiSignalBot.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai-signal-bot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hft-trading-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-signal-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hft-trading-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai-signal-bot
  template:
    metadata:
      labels:
        {{- include "hft-trading-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ai-signal-bot
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ai-signal-bot
          image: "{{ .Values.aiSignalBot.image.repository }}:{{ .Values.aiSignalBot.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["python", "run.py", "--metrics"]
          env:
            - name: LOG_FORMAT
              value: {{ .Values.global.logFormat | quote }}
            # Without WS_URL the bot dials ws://localhost:8765 — loopback of
            # its own pod — and starves on empty market data while probes
            # stay green.
            - name: WS_URL
              value: "ws://{{ .Release.Name }}-exchange-simulator:{{ .Values.exchangeSimulator.ports.ws }}"
            # Publisher auth + sim control-plane auth. Optional refs: the chart
            # renders without the secret, both sides then run unauthenticated
            # (documented fail-open) — set the api-keys secret for real deploys.
            - name: AI_BOT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-keys
                  key: ai-bot-auth-token
                  optional: true
            - name: EXCHANGE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-keys
                  key: exchange-control-token
                  optional: true
            {{- if .Values.aiSignalBot.env.openaiApiKey }}
            - name: OPENAI_API_KEY
              value: {{ .Values.aiSignalBot.env.openaiApiKey | quote }}
            {{- else }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-keys
                  key: openai-api-key
            {{- end }}
          ports:
            - containerPort: {{ .Values.aiSignalBot.ports.ws }}
              name: ws
            - containerPort: {{ .Values.aiSignalBot.ports.metrics }}
              name: metrics
            - containerPort: {{ .Values.aiSignalBot.ports.health }}
              name: health
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.aiSignalBot.ports.health }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.aiSignalBot.ports.health }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.aiSignalBot.resources | nindent 12 }}
        {{- if .Values.hftTradeBot.enabled }}
        - name: hft-trade-bot
          image: "{{ .Values.hftTradeBot.image.repository }}:{{ .Values.hftTradeBot.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/app/hft_trade_bot", {{ .Values.hftTradeBot.configPath | quote }}]
          env:
            # config.prod.yaml resolves ${HFT_EXCHANGE_WS_URL:-...}; without it
            # the sidecar dials its own pod loopback for market data.
            - name: HFT_EXCHANGE_WS_URL
              value: "ws://{{ .Release.Name }}-exchange-simulator:{{ .Values.exchangeSimulator.ports.ws }}"
            # /tmp is read-only (readOnlyRootFilesystem) — the file trigger
            # lives on the writable logs volume instead.
            - name: HFT_KILL_SWITCH_FILE
              value: "/app/logs/kill_switch"
            - name: EXCHANGE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-keys
                  key: exchange-control-token
                  optional: true
          ports:
            - containerPort: 9091
              name: health
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hftTradeBot.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.global.shmSize }}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ai-signal-bot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hft-trading-system.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.aiSignalBot.ports.ws }}
      name: ws
    - port: {{ .Values.aiSignalBot.ports.metrics }}
      name: metrics
    - port: {{ .Values.aiSignalBot.ports.health }}
      name: health
    - port: 9091
      name: hft-health
  selector:
    {{- include "hft-trading-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-signal-bot
{{- end -}}
