{{- if .Values.aiSignalBot.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-ai-signal-bot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hft-trading-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-signal-bot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hft-trading-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai-signal-bot
---
{{- end -}}
{{- if .Values.exchangeSimulator.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-exchange-simulator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hft-trading-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: exchange_simulator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hft-trading-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: exchange_simulator
{{- end -}}
# Note: no PDB for hft-trade-bot — it runs as a sidecar inside the ai-signal-bot
# pod, so the ai-signal-bot PDB already covers it. A standalone hft PDB would
# select zero pods.
