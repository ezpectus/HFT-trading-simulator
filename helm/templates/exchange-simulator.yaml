{{- if .Values.exchangeSimulator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-exchange-simulator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hft-trading-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: exchange_simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hft-trading-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: exchange_simulator
  template:
    metadata:
      labels:
        {{- include "hft-trading-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: exchange_simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: exchange-simulator
          image: "{{ .Values.exchangeSimulator.image.repository }}:{{ .Values.exchangeSimulator.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["python", "-m", "exchange_simulator", "--no-visualizer"]
          env:
            - name: LOG_FORMAT
              value: {{ .Values.global.logFormat | quote }}
            # Without this the sim binds pod-loopback and every probe
            # CrashLoops the pod (httpGet hits the pod IP, not 127.0.0.1).
            - name: EXCHANGE_WS_HOST
              value: "0.0.0.0"
            # Control-plane auth (order/cancel/trading-state). Optional so the
            # chart still renders without the secret — sim then runs open,
            # same as a missing EXCHANGE_CONTROL_TOKEN elsewhere.
            - name: EXCHANGE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-keys
                  key: exchange-control-token
                  optional: true
          ports:
            - containerPort: {{ .Values.exchangeSimulator.ports.ws }}
              name: ws
            - containerPort: {{ .Values.exchangeSimulator.ports.metrics }}
              name: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.exchangeSimulator.ports.metrics }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.exchangeSimulator.ports.metrics }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.exchangeSimulator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-exchange-simulator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hft-trading-system.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.exchangeSimulator.ports.ws }}
      name: ws
    - port: {{ .Values.exchangeSimulator.ports.metrics }}
      name: metrics
  selector:
    {{- include "hft-trading-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: exchange_simulator
{{- end -}}
