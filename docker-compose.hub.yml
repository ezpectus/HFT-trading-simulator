# Pre-built Images (GHCR)
# ====================================
# Uses images built and pushed by .github/workflows/deploy.yml instead of
# building from source. `latest` is tagged on every main/master build;
# release tags follow git tags (v2.0.0 → :2.0.0).
# No compilation required — just `docker-compose -f docker-compose.hub.yml up`.
#
# Images (ghcr.io/ezpectus/hft-tradebot--lite-version/<service>):
#   exchange_simulator · ai-signal-bot · hft-trade-bot · web-ui
#
# Usage:
#   docker-compose -f docker-compose.hub.yml up
#   docker-compose -f docker-compose.hub.yml up -d        # detached
#   docker-compose -f docker-compose.hub.yml logs -f      # follow logs
#   docker-compose -f docker-compose.hub.yml down          # stop all
#
# Web UI: http://localhost:3000

services:
  exchange-simulator:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/exchange_simulator:latest
    container_name: exchange-sim
    ports:
      - "8765:8765"
      - "8775:8775"
    volumes:
      - ./exchange_simulator/config.yaml:/app/exchange_simulator/config.yaml:ro
      - sim-data:/app/data
      - sim-logs:/app/logs
    environment:
      - EXCHANGE_WS_HOST=0.0.0.0
    command: python -m exchange_simulator --no-visualizer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8775/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-net

  ai-signal-bot:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/ai-signal-bot:latest
    container_name: ai-signal-bot
    depends_on:
      exchange-simulator:
        condition: service_healthy
    ports:
      - "8766:8766"
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./ai-signal-bot/config/settings.yaml:/app/config/settings.yaml:ro
      - ai-data:/app/data
      - ai-logs:/app/logs
    command: python run.py --metrics
    environment:
      # S210: service DNS, not the container's own loopback.
      - WS_URL=ws://exchange-simulator:8765
      - AI_BOT_BIND_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - trading-net

  hft-trade-bot:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/hft-trade-bot:latest
    container_name: hft-trade-bot
    depends_on:
      exchange-simulator:
        condition: service_healthy
      ai-signal-bot:
        condition: service_healthy
    volumes:
      - ./hft-trade-bot/config:/app/config:ro
      - hft-logs:/app/logs
    ports:
      - "9091:9091"
    # Prod image (Dockerfile.prod) copies the binary to /app/hft_trade_bot —
    # the dev ./build/ path doesn't exist in the runtime stage. config.prod.yaml
    # resolves ${HFT_EXCHANGE_WS_URL} the same way.
    command: /app/hft_trade_bot config/config.prod.yaml
    environment:
      # S210: config.yaml resolves ${HFT_*_WS_URL:-localhost} — inject the
      # compose service names or the bot dials its own loopback.
      - HFT_EXCHANGE_WS_URL=ws://exchange-simulator:8765
      - HFT_AI_SIGNAL_WS_URL=ws://ai-signal-bot:8766
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-net

  web-ui:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/web-ui:latest
    container_name: web-ui
    depends_on:
      exchange-simulator:
        condition: service_healthy
      ai-signal-bot:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - trading-net

volumes:
  sim-data:
  sim-logs:
  ai-data:
  ai-logs:
  hft-logs:

networks:
  trading-net:
    driver: bridge
