# Prometheus Alert Rules
#
# Defines alert rules for trading system metrics.
# All metric names match those exposed by:
#   - exchange_simulator/ws_prometheus.py (exchange_* metrics)
#   - ai-signal-bot/src/communication/metrics_server.py (ai_signal_bot_* metrics)

groups:
  - name: error_rate_alerts
    interval: 30s
    rules:
      - alert: HighBotErrorRate
        expr: rate(ai_signal_bot_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: ai-signal-bot
        annotations:
          summary: "High bot error rate"
          description: "Error rate is {{ $value }} errors/sec"

      - alert: CriticalBotErrorRate
        expr: rate(ai_signal_bot_errors_total[5m]) > 1.0
        for: 2m
        labels:
          severity: critical
          component: ai-signal-bot
        annotations:
          summary: "Critical bot error rate"
          description: "Error rate is {{ $value }} errors/sec"

  - name: trading_alerts
    interval: 60s
    rules:
      - alert: HighDrawdown
        expr: ai_signal_bot_drawdown > 0.08
        for: 5m
        labels:
          severity: warning
          component: ai-signal-bot
        annotations:
          summary: "High drawdown"
          description: "Drawdown is {{ $value * 100 }}% (threshold 8%)"

      - alert: CriticalDrawdown
        expr: ai_signal_bot_drawdown > 0.15
        for: 2m
        labels:
          severity: critical
          component: ai-signal-bot
        annotations:
          summary: "Critical drawdown"
          description: "Drawdown is {{ $value * 100 }}% (threshold 15%)"

      - alert: LowWinRate
        expr: ai_signal_bot_win_rate < 0.4
        for: 30m
        labels:
          severity: warning
          component: ai-signal-bot
        annotations:
          summary: "Low win rate"
          description: "Win rate is {{ $value * 100 }}%"

      - alert: NegativePnL
        expr: ai_signal_bot_pnl_total < 0
        for: 10m
        labels:
          severity: warning
          component: ai-signal-bot
        annotations:
          summary: "Negative PnL"
          description: "Total PnL is {{ $value }}"

  - name: exchange_simulator_alerts
    interval: 30s
    rules:
      - alert: HighOrderRejectionRate
        expr: exchange_orders_rejected_total / exchange_orders_submitted_total > 0.1
        for: 5m
        labels:
          severity: warning
          component: exchange-simulator
        annotations:
          summary: "High order rejection rate"
          description: "Rejection rate is {{ $value * 100 }}% for {{ $labels.exchange }}"

      - alert: NoConnectedClients
        expr: exchange_connected_clients == 0
        for: 2m
        labels:
          severity: warning
          component: exchange-simulator
        annotations:
          summary: "No WebSocket clients connected"
          description: "No clients connected to exchange simulator for 2+ minutes"

      - alert: TradingStopped
        expr: exchange_trading_active == 0
        for: 1m
        labels:
          severity: warning
          component: exchange-simulator
        annotations:
          summary: "Trading is STOPPED"
          description: "Trading has been stopped. All order submissions are being rejected."

      - alert: HighDisconnectionRate
        expr: rate(exchange_ws_disconnections_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          component: exchange-simulator
        annotations:
          summary: "High WebSocket disconnection rate"
          description: "Clients disconnecting more than 0.5/s over 5 minutes"
