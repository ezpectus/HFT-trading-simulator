apiVersion: 1

providers:
  - name: "HFT Trading System Dashboards"
    orgId: 1
    folder: "HFT Trading System"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
