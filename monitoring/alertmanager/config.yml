# Prometheus Alertmanager Configuration
#
# Configures notification channels (email, Slack), alert routing,
# alert grouping, and escalation policies.
#
# Environment variables (render via envsubst before passing to Alertmanager):
#   SMTP_SMARTHOST       — e.g. smtp.gmail.com:587
#   SMTP_FROM            — sender email address
#   SMTP_AUTH_USERNAME   — SMTP auth user
#   SMTP_AUTH_PASSWORD   — SMTP auth password
#   ALERT_EMAIL_TO       — default alert recipient email
#   ALERT_EMAIL_ONCALL   — on-call recipient email (critical)
#   SLACK_WEBHOOK_URL    — Slack incoming webhook URL
#   SLACK_CHANNEL_CRITICAL  — Slack channel for critical alerts (default: #trading-critical)
#   SLACK_CHANNEL_WARNING   — Slack channel for warning alerts (default: #trading-warnings)
#
# Render with:
#   envsubst < config.yml > /etc/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_SMARTHOST}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_AUTH_USERNAME}'
  smtp_auth_password: '${SMTP_AUTH_PASSWORD}'
  smtp_require_tls: true

# Route configuration
route:
  group_by: ['alertname', 'severity', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  routes:
    # Critical alerts go to all channels immediately
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: false

    # Warning alerts go to Slack and email
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: false

    # Info alerts go to email only
    - match:
        severity: info
      receiver: 'info-alerts'
      continue: false

# Receivers configuration
receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        headers:
          Subject: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}'

  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_ONCALL}'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL_CRITICAL}'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL_WARNING}'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'info-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        headers:
          Subject: '[INFO] {{ .GroupLabels.alertname }}'

# Inhibition rules to prevent alert spam
inhibit_rules:
  # If critical alert is firing, inhibit warning alerts for same component
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component', 'alertname']

  # If critical alert is firing, inhibit info alerts for same component
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['component', 'alertname']

# Templates for custom alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'
