# Production Docker Compose — full trading system with real exchange connectivity
# Usage: docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  # ── Prometheus — metrics scraping ──
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: trading-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Alertmanager — alert grouping/routing for Prometheus rules ──
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: trading-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ── Grafana — dashboards and visualization ──
  grafana:
    image: grafana/grafana:11.4.0
    container_name: trading-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/trading-overview.json
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - monitoring
      - frontend

  # ── Exchange Simulator (Python) — market simulation for fallback ──
  exchange-simulator:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/exchange_simulator:${IMAGE_TAG:-latest}
    build:
      context: ./exchange_simulator
      dockerfile: Dockerfile.prod
    container_name: trading-exchange-sim
    ports:
      - "8765:8765"
      - "8775:8775"
    volumes:
      - ./exchange_simulator/config.yaml:/app/exchange_simulator/config.yaml:ro
      - sim-data:/app/data
    command: python -m exchange_simulator --no-visualizer
    environment:
      - LOG_FORMAT=json
      # 0.0.0.0 — the baked config binds localhost, which is unreachable via the
      # published ports from outside the container.
      - EXCHANGE_WS_HOST=0.0.0.0
      # Gates order/cancel/trading-state/config commands; ai-bot + hft inherit
      # the same var via env_file, the web UI gets VITE_EXCHANGE_TOKEN at build.
      - EXCHANGE_CONTROL_TOKEN=${EXCHANGE_CONTROL_TOKEN:?EXCHANGE_CONTROL_TOKEN must be set in .env.prod}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8775/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - frontend
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # ── AI Signal Bot (Python) — strategy signals + real market data ──
  ai-signal-bot:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/ai-signal-bot:${IMAGE_TAG:-latest}
    build:
      context: ./ai-signal-bot
      dockerfile: Dockerfile.prod
    container_name: trading-ai-signal-bot
    depends_on:
      exchange-simulator:
        condition: service_healthy
    ports:
      - "8766:8766"
      - "8080:8080"  # HealthServer — /live /ready /health*
      - "9092:9090"  # Prometheus metrics
    env_file:
      - .env.prod
    environment:
      - LOG_FORMAT=json
      # service DNS, not loopback — settings.yaml defaults to localhost.
      - WS_URL=ws://exchange-simulator:8765
      - AI_BOT_BIND_HOST=0.0.0.0
    volumes:
      - ./ai-signal-bot/config/settings.yaml:/app/config/settings.yaml:ro
      - ai-data:/app/data
      - ai-logs:/app/logs
    # SHM IPC with C++ bot: shareable IPC namespace so hft-trade-bot can join it
    ipc: shareable
    command: python run.py --metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - backend
      - frontend
      - monitoring
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  # ── HFT Trade Bot (C++) — low-latency execution ──
  hft-trade-bot:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/hft-trade-bot:${IMAGE_TAG:-latest}
    build:
      context: ./hft-trade-bot
      dockerfile: Dockerfile.prod
    container_name: trading-hft-bot
    depends_on:
      ai-signal-bot:
        condition: service_healthy
    ports:
      - "9091:9091"  # Health/metrics endpoint
    env_file:
      - .env.prod
    environment:
      # config.prod.yaml resolves ${HFT_EXCHANGE_WS_URL}; default is the
      # compose service name — overridable via .env.prod for other networks.
      - HFT_EXCHANGE_WS_URL=${HFT_EXCHANGE_WS_URL:-ws://exchange-simulator:8765}
    volumes:
      - ./hft-trade-bot/config:/app/config:ro
      - hft-logs:/app/logs
    # SHM IPC: join the ai-signal-bot container's IPC namespace (shared memory)
    ipc: "container:trading-ai-signal-bot"
    command: /app/hft_trade_bot config/config.prod.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2'

  # ── Web UI (React + nginx) — dashboard with 200+ panels ──
  web-ui:
    image: ghcr.io/ezpectus/hft-tradebot--lite-version/web-ui:${IMAGE_TAG:-latest}
    build:
      context: ./web-ui
      dockerfile: Dockerfile.prod
      args:
        # Browser-facing WebSocket endpoints — baked into the JS bundle at
        # build time. Required in prod; a localhost default would point every
        # user's browser at their own machine.
        - VITE_WS_EXCHANGE=${VITE_WS_EXCHANGE:?VITE_WS_EXCHANGE must be set in .env.prod (e.g. ws://your-host:8765)}
        - VITE_WS_SIGNALS=${VITE_WS_SIGNALS:?VITE_WS_SIGNALS must be set in .env.prod (e.g. ws://your-host:8766)}
        - VITE_SIGNAL_TOKEN=${VITE_SIGNAL_TOKEN:-}
        # Must equal EXCHANGE_CONTROL_TOKEN — without it the UI's order/cancel
        # buttons get auth errors in prod.
        - VITE_EXCHANGE_TOKEN=${VITE_EXCHANGE_TOKEN:?VITE_EXCHANGE_TOKEN must be set in .env.prod (same value as EXCHANGE_CONTROL_TOKEN)}
    container_name: trading-web-ui
    depends_on:
      ai-signal-bot:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  prom-data:
  alertmanager-data:
  grafana-data:
  sim-data:
  ai-data:
  ai-logs:
  hft-logs:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
