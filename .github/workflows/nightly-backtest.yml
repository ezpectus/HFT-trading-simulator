name: Nightly Walk-Forward Backtest

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-backtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  walk-forward:
    name: Walk-Forward Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-signal-bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ai-signal-bot

      - name: Generate walk-forward test data
        run: |
          python -c "
          import json, os, random, math
          os.makedirs('data/exports', exist_ok=True)
          random.seed(42)
          # Generate 1 year of 1m candles for BTC/USDT
          candles = []
          price = 65000.0
          start_time = 1704067200  # 2024-01-01
          for i in range(525600):  # 1 year of minutes
              dt = i * 60
              ret = random.gauss(0, 0.0003)
              trend = math.sin(i / 10000) * 0.0001
              price *= (1 + ret + trend)
              vol = random.uniform(0.5, 5.0) * (1 + abs(ret) * 100)
              candles.append({
                  'time': start_time + dt,
                  'open': price,
                  'high': price * (1 + abs(random.gauss(0, 0.0001))),
                  'low': price * (1 - abs(random.gauss(0, 0.0001))),
                  'close': price * (1 + ret),
                  'volume': vol,
              })
          with open('data/exports/btc_usdt_1m.csv', 'w') as f:
              f.write('time,open,high,low,close,volume\n')
              for c in candles:
                  f.write(f\"{c['time']},{c['open']:.2f},{c['high']:.2f},{c['low']:.2f},{c['close']:.2f},{c['volume']:.4f}\n\")
          print(f'Generated {len(candles)} candles')
          "
        working-directory: ai-signal-bot

      - name: Run walk-forward backtest
        run: python ../scripts/walk_forward_ci.py --csv data/exports/btc_usdt_1m.csv --output walk_forward_results.json
        working-directory: ai-signal-bot

      - name: Check performance regression
        run: |
          python -c "
          import json, sys
          with open('walk_forward_results.json') as f:
              results = json.load(f)['windows']

          failed = False

          # Fail if the run itself is broken: >50% of windows errored means
          # the backtest is broken, not just underperforming.
          errors = [r for r in results if 'error' in r]
          if not results:
              print('::error::No backtest windows produced results')
              failed = True
          elif len(errors) > len(results) * 0.5:
              print(f'::error::{len(errors)}/{len(results)} windows errored — backtest broken')
              failed = True

          # Check if any strategy has consistently negative returns
          strategies = set(r['strategy'] for r in results)
          regressions = []

          for s in strategies:
              s_results = [r for r in results if r['strategy'] == s and 'error' not in r]
              if not s_results:
                  regressions.append(f'{s}: all windows errored')
                  continue
              avg_return = sum(r['total_return_pct'] for r in s_results) / len(s_results)
              if avg_return < -5.0:
                  regressions.append(f'{s}: avg return {avg_return:.2f}%')

          if regressions:
              print('::error::Performance regression detected:')
              for r in regressions:
                  print(f'  {r}')
              failed = True

          if failed:
              sys.exit(1)
          print('No performance regressions detected')
          "
        working-directory: ai-signal-bot

      - uses: actions/upload-artifact@v4
        with:
          name: walk-forward-results
          path: ai-signal-bot/walk_forward_results.json
          retention-days: 30

      - name: Create issue on regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly Walk-Forward Backtest Regression';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Dedup: a persistent regression must comment on the existing
            // issue, not open a fresh one every night.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const dupe = open.find(i => i.title === title && !i.pull_request);
            if (dupe) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dupe.number,
                body: `Regression still failing — latest run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The nightly walk-forward backtest detected a performance regression. Run: ${runUrl}\nSee artifacts for details.`,
                labels: ['regression', 'nightly-backtest']
              });
            }
