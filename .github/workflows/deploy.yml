name: Deploy

on:
  push:
    tags: ["v*.*.*"]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-web-ui:
    name: Deploy Web UI to Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - name: Build
        run: npm run build
        working-directory: web-ui
        env:
          # Public dashboard gets real WS endpoints; control/auth tokens are
          # deliberately NOT baked into the public bundle (view-only site).
          VITE_WS_EXCHANGE: ${{ vars.VITE_WS_EXCHANGE }}
          VITE_WS_SIGNALS: ${{ vars.VITE_WS_SIGNALS }}
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: web-ui/dist
          production-branch: master
          production-deploy: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [exchange_simulator, ai-signal-bot, hft-trade-bot, web-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # web-ui needs VITE_WS_* + VITE_*_TOKEN build args (inlined into the
          # bundle at build time). Other services ignore these args. Without
          # the tokens the deployed UI gets auth_failed on every control
          # command (EXCHANGE_CONTROL_TOKEN is required in prod).
          build-args: |
            VITE_WS_EXCHANGE=${{ vars.VITE_WS_EXCHANGE }}
            VITE_WS_SIGNALS=${{ vars.VITE_WS_SIGNALS }}
            VITE_SIGNAL_TOKEN=${{ secrets.VITE_SIGNAL_TOKEN }}
            VITE_EXCHANGE_TOKEN=${{ secrets.VITE_EXCHANGE_TOKEN }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + config files to server
        uses: appleboy/scp-action@v0.1.13
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,.env.prod.example,Makefile.prod,monitoring,exchange_simulator/config.yaml,ai-signal-bot/config,hft-trade-bot/config"
          target: "/opt/hft/"

      - name: Pull and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/hft
            if [ ! -f .env.prod ]; then
              echo "::error::/opt/hft/.env.prod missing on the server — copy .env.prod.example to .env.prod and set real values before deploying"
              exit 1
            fi
            # Tag pushed images are semver without the leading v (v2.0.0 → 2.0.0)
            export IMAGE_TAG="${{ github.ref_name }}"
            export IMAGE_TAG="${IMAGE_TAG#v}"
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Check health endpoints
        run: |
          sleep 15
          FAIL=0
          for endpoint in \
            "http://${{ secrets.DEPLOY_HOST }}:8775/health" \
            "http://${{ secrets.DEPLOY_HOST }}:8080/ready" \
            "http://${{ secrets.DEPLOY_HOST }}:9091/health" \
            "http://${{ secrets.DEPLOY_HOST }}:3000/health" \
            "http://${{ secrets.DEPLOY_HOST }}:3001/api/health"; do
            echo "Checking $endpoint..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$endpoint" || echo "FAIL")
            echo "  Status: $status"
            if [ "$status" != "200" ]; then
              echo "FAIL: $endpoint returned $status"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "Health check failed — one or more endpoints unreachable"
            exit 1
          fi
          echo "All health checks passed"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy, health-check]
    if: always()
    env:
      # secrets.* isn't allowed in step `if:` — hoist to env so the gates
      # actually see the values (vars.* gates never opened).
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Discord notification
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "Deployment ${{ github.ref_name }}: ${{ contains(needs.*.result, 'failure') && 'FAILED' || contains(needs.*.result, 'cancelled') && 'CANCELLED' || (needs.deploy.result == 'skipped' && 'BUILD OK — deploy skipped (tags v* only)') || 'SUCCESS' }}"

      - name: Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            HFT Trading System deployment ${{ github.ref_name }}
            Status: ${{ contains(needs.*.result, 'failure') && 'FAILED ❌' || contains(needs.*.result, 'cancelled') && 'CANCELLED' || (needs.deploy.result == 'skipped' && 'BUILD OK — deploy skipped (tags v* only)') || 'SUCCESS ✅' }}
            Commit: ${{ github.sha }}
