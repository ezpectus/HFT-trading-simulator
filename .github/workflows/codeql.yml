name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore:
      - 'vcpkg/**'
      - 'web-ui/node_modules/**'
      - 'websocketpp/**'
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'vcpkg/**'
      - 'web-ui/node_modules/**'
      - 'websocketpp/**'
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [cpp, python, javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - 'vcpkg/**'
              - 'web-ui/node_modules/**'
              - 'websocketpp/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
