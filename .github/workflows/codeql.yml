name: CodeQL

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'vcpkg/**'
      - 'web-ui/node_modules/**'
      - 'websocketpp/**'
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'vcpkg/**'
      - 'web-ui/node_modules/**'
      - 'websocketpp/**'
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
          - language: javascript
          - language: cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - 'vcpkg/**'
              - 'web-ui/node_modules/**'
              - 'websocketpp/**'

      - name: Build C++ (manual)
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake libboost-dev libboost-system-dev libboost-random-dev \
            libssl-dev libspdlog-dev libfmt-dev nlohmann-json3-dev \
            libyaml-cpp-dev libasio-dev libwebsocketpp-dev
          sudo sed -i 's/endpoint<connection,config>/endpoint/g' /usr/include/websocketpp/endpoint.hpp
          sudo sed -i 's/basic<concurrency,names>/basic/g' /usr/include/websocketpp/logger/basic.hpp
          sudo sed -i 's/stub<concurrency,names>/stub/g' /usr/include/websocketpp/logger/stub.hpp
          cd hft-trade-bot
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DUSE_CCACHE=OFF -DUSE_UNITY_BUILD=OFF
          cmake --build build -j$(nproc) --target hft_trade_bot || true

      - name: Autobuild (non-C++)
        if: matrix.language != 'cpp'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
